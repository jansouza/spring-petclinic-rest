# MIGRATION (Spring Boot -> Quarkus, Spring compatibility strategy)
#
# Database selection
# ------------------------------------------------
# The Spring application selected the database with spring.profiles.active=h2 (default), hsqldb, mysql or postgres.
# In Quarkus the profile is selected with -Dquarkus.profile=<profile> (or QUARKUS_PROFILE) and loads
# application-<profile>.properties. When no profile is set, the defaults below apply (H2).
#
# IMPORTANT: quarkus.datasource.db-kind is a BUILD-TIME property. To run against MySQL or PostgreSQL the artifact must
# be built with the matching profile, e.g.:  ./mvnw package -Dquarkus.profile=postgres
#
# TODO: Migration required - the 'hsqldb' profile is not supported: Quarkus has no JDBC extension for HSQLDB.
#
# Repository layer selection
# ------------------------------------------------
# The Spring application selected the repository implementation with the profiles 'jpa', 'jdbc' and 'spring-data-jpa'.
# In Quarkus the plain-JPA implementation (repository/jpa) is always active; the jdbc and spring-data-jpa
# implementations are not compiled. See docs/quarkus-migration-decisions.md (D4).
# ------------------------------------------------

quarkus.http.port=9966
# Security rules: do not listen on all interfaces by default (Quarkus' default prod host is 0.0.0.0).
# In a container set PETCLINIC_HTTP_HOST to the container interface address (e.g. 0.0.0.0 only behind a trusted network boundary).
# NOTE: no dev/test override is needed (dev and test mode already bind to localhost).
quarkus.http.host=${PETCLINIC_HTTP_HOST:127.0.0.1}
quarkus.http.root-path=/petclinic/

# Default database (H2, in-memory); can be overridden by profile-specific property files
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:petclinic;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
quarkus.datasource.username=sa
quarkus.datasource.password=

# Hibernate ORM
# Was: spring.jpa.hibernate.ddl-auto=update + spring.sql.init.mode=always (schema.sql + data.sql on every restart).
# The schema is now generated from the entities on every start, then data.sql is loaded (good for local dev).
# Change to 'none' or 'validate' in production.
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.sql-load-script=db/h2/data.sql
quarkus.hibernate-orm.log.sql=true
# Spring Boot defaulted to snake_case column names; Quarkus (Hibernate 6) preserves Java names
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
# spring.jpa.open-in-view=false -> not applicable in Quarkus (no OSIV)

# TODO: Migration required - spring.messages.basename=messages/messages (Spring MessageSource) has no direct Quarkus
# equivalent; the bundles in src/main/resources/messages are kept until the usage is confirmed.

# CORS
# Was: @CrossOrigin(exposedHeaders = "errors, content-type") on every controller, which allowed ALL origins.
# Quarkus has no per-class @CrossOrigin; CORS is global. Per the project security rules a wildcard origin is NOT used:
# set the allowed origins explicitly (default: the Petclinic Angular dev server) via QUARKUS_HTTP_CORS_ORIGINS.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${PETCLINIC_CORS_ORIGINS:http://localhost:4200}
quarkus.http.cors.exposed-headers=errors,content-type

# OpenAPI / Swagger UI
# Was: springdoc (/v3/api-docs, /swagger-ui). Now: quarkus-smallrye-openapi
#   OpenAPI document: <root-path>/q/openapi     Swagger UI: <root-path>/q/swagger-ui
quarkus.swagger-ui.always-include=true

# Logging
# Was: logging.level.org.springframework=INFO and logback.xml (org.springframework.samples.petclinic=debug).
# REMOVED: src/main/resources/logback.xml - Quarkus uses JBoss Log Manager and ignores Logback configuration; its single logger setting is below.
quarkus.log.category."org.springframework.samples.petclinic".level=DEBUG
#quarkus.log.category."org.hibernate.SQL".level=DEBUG
#quarkus.log.category."org.hibernate.orm.jdbc.bind".level=TRACE

# enable the desired authentication type
# by default, the authentication is disabled
petclinic.security.enable=false
