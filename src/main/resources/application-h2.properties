# H2 Database Configuration (Quarkus profile 'h2'; also the default configuration)
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:petclinic;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
quarkus.datasource.username=sa
quarkus.datasource.password=

# Hibernate Configuration
# Change to 'none' or 'validate' in production
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.sql-load-script=db/h2/data.sql
quarkus.hibernate-orm.log.sql=true

# TODO: Migration required - H2 Console (spring.h2.console.enabled=true, path=/h2-console) has no Quarkus equivalent.
