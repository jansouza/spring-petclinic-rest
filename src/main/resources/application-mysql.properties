# MySQL Configuration (Quarkus profile 'mysql')
# db-kind is a build-time property: build with -Dquarkus.profile=mysql
quarkus.datasource.db-kind=mysql
quarkus.datasource.jdbc.url=${MYSQL_URL:jdbc:mysql://localhost/petclinic}
quarkus.datasource.username=${MYSQL_USER:petclinic}
quarkus.datasource.password=${MYSQL_PASS:petclinic}

# Was: spring.sql.init.mode=always with the idempotent schema.sql/data.sql scripts
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.sql-load-script=db/mysql/data.sql
