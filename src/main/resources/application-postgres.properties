# PostgreSQL Configuration (Quarkus profile 'postgres')
# db-kind is a build-time property: build with -Dquarkus.profile=postgres
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${POSTGRES_URL:jdbc:postgresql://localhost/petclinic}
quarkus.datasource.username=${POSTGRES_USER:petclinic}
quarkus.datasource.password=${POSTGRES_PASS:petclinic}

# Was: spring.sql.init.mode=always with the idempotent schema.sql/data.sql scripts
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.sql-load-script=db/postgres/data.sql
